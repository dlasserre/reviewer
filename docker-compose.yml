# Le demon de revue.
#
#   docker compose up -d      et c'est tout.
#
# Puis ouvrir http://127.0.0.1:8788 : tant qu'il n'a pas de configuration, le
# demon sert la page qui permet d'en faire une — jetons, depots, relecteurs. Il
# clone, installe les dependances, ecrit la configuration, et repart avec.
#
# Le `.env` reste possible pour qui prefere : les jetons y sont lus s'ils y sont,
# et la page ne les redemande pas. Rien n'y est OBLIGATOIRE.

# La construction, ecrite UNE fois. Les services la partagent : un service qui
# nomme une image sans savoir la batir fait tenter un `pull` a compose, et
# l'erreur — « pull access denied » — n'evoque pas la cause.
x-construction: &construction
  build:
    context: .
    args:
      # Sous Linux, faire correspondre l'UID a celui de l'hote : l'agent ecrit
      # dans des worktrees, et un fichier cree par un autre UID devient
      # impossible a modifier depuis l'hote.
      #   UID=$(id -u) GID=$(id -g) docker compose build
      UID: "${UID:-1000}"
      GID: "${GID:-1000}"
  image: reviewer

x-secrets: &secrets
  # FACULTATIFS. Absents, la page d'installation les demande et les ecrit dans
  # `config/.secrets.env`. Presents, ils GAGNENT sur ce fichier : un secret
  # injecte par l'orchestrateur doit primer, sinon on ne sait plus lequel tourne.
  PAT_READ: "${PAT_READ:-}"
  PAT_WRITE: "${PAT_WRITE:-}"
  CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
  # Le SDK place ANTHROPIC_API_KEY AVANT le jeton OAuth : une variable qui traine
  # ferait basculer la facturation vers l'API payante, en silence.
  ANTHROPIC_API_KEY: ""
  # La SEULE ligne d'un profil qui ne soit pas portable : ou vivent les copies
  # locales. Ici elles sont dans le volume, sous /repos.
  REVIEWER_WORKSPACE: /repos

services:
  runner:
    <<: *construction
    restart: unless-stopped
    environment: *secrets

    volumes:
      # La configuration, EN ECRITURE — c'est la page d'installation qui l'ecrit,
      # une fois, tant qu'il n'y en a pas. Une fois ecrite, le demon sert la
      # console normale, qui n'a aucune route d'ecriture : le chemin de code qui
      # ecrit n'existe QUE tant qu'il n'y a rien a proteger.
      #
      # Un dossier de l'HOTE, pas un volume : le YAML se relit, se versionne et
      # se compare dans une revue. Enfermé dans un volume, il ne se relirait plus.
      - ./config:/config

      # Les depots DU CONTENEUR. Un volume, pas un montage de vos dossiers : le
      # conteneur est Linux, l'hote souvent non, et `node_modules` / `.venv` ne
      # se partagent pas entre les deux. Mesure du 29/08/2026 : un `npm ci` dans
      # le conteneur avait remplace le `node_modules` Windows d'un depot monte.
      - repos:/repos

      # L'etat : baux, journaux, points de reprise, worktrees.
      - var:/var/agent-runner

    ports:
      # 127.0.0.1 cote HOTE, et c'est ce qui rend l'ecoute sur 0.0.0.0 acceptable
      # dans le conteneur : la surface exposee est celle d'une ecoute locale.
      - "127.0.0.1:8788:8788"

  # Un shell dans la MEME image et sur les MEMES volumes. Utile pour regarder ce
  # qui a ete clone, relancer une installation de dependances a la main, ou
  # deboguer. Ne demarre jamais tout seul.
  outils:
    <<: *construction
    profiles: ["outils"]
    environment: *secrets
    entrypoint: ["/bin/bash"]
    volumes:
      - ./config:/config
      - repos:/repos
      - var:/var/agent-runner
    working_dir: /repos

  # L'assistant en TERMINAL, pour qui prefere. La page fait la meme chose.
  init:
    <<: *construction
    profiles: ["init"]
    environment: *secrets
    volumes:
      - ./config:/config
      - repos:/repos
    command: ["-c", "/config/runner.yaml", "init"]

volumes:
  var:
  # Les clones DU CONTENEUR. Separes de ceux de l'hote, et c'est le point : ils
  # portent des dependances Linux qui casseraient un poste Windows ou macOS.
  repos:
